<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>My Courses</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/home">
            Course Registration
        </a>

        <a class="btn btn-warning"
           href="/home">
            ← Back to Home
        </a>

    </div>

</nav>


<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0">

                My Registered Courses

                <span class="badge bg-warning text-dark ms-2"
                      th:text="${#lists.size(courses)}">
</span>

            </h4>

        </div>


        <div class="card-body">

            <table class="table table-striped table-hover">

                <thead class="table-dark">

                <tr>

                    <th>#</th>
                    <th>Course Name</th>
                    <th>Credits</th>
                    <th>Lecturer</th>
                    <th>Enroll Date</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="e, stat : ${courses}">

                    <td th:text="${stat.count}"></td>

                    <td th:text="${e.course.name}"></td>

                    <td>
<span class="badge bg-success"
      th:text="${e.course.credits}">
</span>
                    </td>

                    <td th:text="${e.course.lecturer}"></td>

                    <td th:text="${e.enrollDate}"></td>

                </tr>

                <tr th:if="${#lists.isEmpty(courses)}">

                    <td colspan="5" class="text-center text-muted">

                        You have not registered any courses yet

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
