<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Course Registration</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<!-- NAVBAR -->

<div th:replace="fragments/navbar :: navbar"></div>

<!-- COURSE LIST -->

<div class="container mt-4">

    <h2 class="text-center mb-4">
        Available Courses
    </h2>

    <div class="row">

        <div class="col-md-4 mb-4"
             th:each="c : ${courses.content}">

            <div class="card shadow h-100">

                <img th:src="${c.image}"
                     class="card-img-top"
                     style="height:200px;object-fit:cover">

                <div class="card-body">

                    <h5 class="card-title"
                        th:text="${c.name}">
                    </h5>

                    <p>

                        Credits:
                        <b th:text="${c.credits}"></b>

                    </p>

                    <p>

                        Lecturer:
                        <span th:text="${c.lecturer}"></span>

                    </p>

                </div>

                <div class="card-footer bg-white">

                    <a class="btn btn-success w-100"
                       th:if="${#authorization.expression('hasRole(''STUDENT'')')}"
                       th:href="@{/enroll/{id}(id=${c.id})}">

                        Enroll

                    </a>

                </div>

            </div>

        </div>

    </div>

    <!-- PAGINATION -->

    <nav class="mt-4">

        <ul class="pagination justify-content-center">

            <li class="page-item"
                th:classappend="${courses.first}? 'disabled'">

                <a class="page-link"
                   th:href="@{/home(page=${courses.number-1},keyword=${param.keyword})}">

                    Previous

                </a>

            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0,courses.totalPages-1)}"
                th:classappend="${i==courses.number}? 'active'">

                <a class="page-link"
                   th:href="@{/home(page=${i},keyword=${param.keyword})}"
                   th:text="${i+1}">
                </a>

            </li>

            <li class="page-item"
                th:classappend="${courses.last}? 'disabled'">

                <a class="page-link"
                   th:href="@{/home(page=${courses.number+1},keyword=${param.keyword})}">

                    Next

                </a>

            </li>

        </ul>

    </nav>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
