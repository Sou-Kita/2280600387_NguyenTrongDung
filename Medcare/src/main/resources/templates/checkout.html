<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">💳 Thanh toán đơn hàng</h2>

    <div class="row">

        <!-- Thông tin khách hàng -->
        <div class="col-md-6">
            <div class="card shadow-sm p-4">

                <h5 class="mb-3">Thông tin nhận hàng</h5>

                <form th:action="@{/cart/checkout}" method="post">

                    <div class="mb-3">
                        <label>Họ và tên</label>
                        <input type="text" name="fullName"
                               class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Số điện thoại</label>
                        <input type="text" name="phone"
                               class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Địa chỉ giao hàng</label>
                        <textarea name="address"
                                  class="form-control"
                                  rows="3" required></textarea>
                    </div>

                    <button class="btn btn-success w-100">
                        ✅ Xác nhận đặt hàng
                    </button>

                </form>

            </div>
        </div>

        <!-- Tóm tắt đơn hàng -->
        <div class="col-md-6">
            <div class="card shadow-sm p-4">

                <h5 class="mb-3">Tóm tắt đơn hàng</h5>

                <div th:each="item : ${cartItems}"
                     class="d-flex justify-content-between mb-2">

                    <span>
                        <span th:text="${item.product.name}"></span>
                        (x<span th:text="${item.quantity}"></span>)
                    </span>

                    <span class="fw-bold"
                          th:text="${#numbers.formatDecimal(item.product.price * item.quantity,0,'COMMA',0,'POINT')} + ' đ'">
                    </span>
                </div>

                <hr>

                <h5 class="text-end">
                    Tổng tiền:
                    <span class="text-danger fw-bold"
                          th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT')} + ' đ'">
                    </span>
                </h5>

            </div>
        </div>

    </div>

</div>

</body>
</html>
