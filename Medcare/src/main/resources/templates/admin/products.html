<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>⚙ Quản lý sản phẩm</h2>

<a href="/admin/products/create" class="btn btn-success mb-3">
    ➕ Thêm sản phẩm
</a>

<table class="table table-bordered">
    <thead>
    <tr>
        <th>ID</th>
        <th>Tên</th>
        <th>Giá</th>
        <th>Tồn kho</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.price}"></td>
        <td th:text="${p.stock}"></td> <!-- THÊM DÒNG NÀY -->

        <td>
            <a th:href="@{'/admin/products/edit/' + ${p.id}}"
               class="btn btn-warning btn-sm">✏ Sửa</a>

            <a th:href="@{'/admin/products/delete/' + ${p.id}}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('Xóa sản phẩm này?')">
                🗑 Xóa
            </a>
        </td>
    </tr>
    </tbody>
</table>

<a href="/" class="btn btn-secondary">⬅ Quay lại trang chủ</a>

</body>
</html>
