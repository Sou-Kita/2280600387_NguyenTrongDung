<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm / Sửa sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 th:text="${product.id == null ? 'Thêm sản phẩm' : 'Chỉnh sửa sản phẩm'}"></h2>

<form th:action="@{/admin/products/save}"
      method="post"
      th:object="${product}"
      enctype="multipart/form-data">

    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label>Tên sản phẩm</label>
        <input type="text" class="form-control" th:field="*{name}" required>
    </div>

    <div class="mb-3">
        <label>Mô tả</label>
        <textarea class="form-control" th:field="*{description}"></textarea>
    </div>

    <div class="mb-3">
        <label>Giá</label>
        <input type="number" class="form-control" th:field="*{price}" required>
    </div>

    <div class="mb-3">
        <label>Tồn kho</label>
        <input type="number" class="form-control" th:field="*{stock}" required>
    </div>

    <!-- Upload ảnh -->
    <div class="mb-3">
        <label>Ảnh sản phẩm</label>
        <input type="file" name="imageFile" class="form-control">
    </div>

    <!-- Hiển thị ảnh cũ khi sửa -->
    <div class="mb-3" th:if="${product.imageUrl != null}">
        <img th:src="@{'/images/products/' + ${product.imageUrl}}"
             width="150"
             class="img-thumbnail">
    </div>

    <a th:href="@{/products}" class="btn btn-outline-secondary">
        💾 Lưu
    </a>
    <button type="button" onclick="history.back()"
            class="btn btn-secondary">
        ← Quay lại
    </button>

</form>

</body>
</html>
