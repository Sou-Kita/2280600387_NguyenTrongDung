<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🛒 Giỏ hàng của bạn</h2>
        <a th:href="@{/products}" class="btn btn-outline-secondary">
            ← Quay lại
        </a>
    </div>

    <!-- Giỏ hàng trống -->
    <div th:if="${#lists.isEmpty(cartItems)}">
        <div class="alert alert-warning text-center">
            Giỏ hàng của bạn đang trống 🥲
        </div>
    </div>

    <!-- Bảng giỏ hàng -->
    <div class="card shadow-sm" th:if="${not #lists.isEmpty(cartItems)}">
        <div class="card-body p-0">

            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark text-center">
                <tr>
                    <th>Ảnh</th>
                    <th class="text-start">Sản phẩm</th>
                    <th>Giá</th>
                    <th>Số lượng</th>
                    <th>Tổng</th>
                    <th></th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="item : ${cartItems}" class="text-center">

                    <!-- Ảnh -->
                    <td>
                        <img th:src="@{'/images/products/' + ${item.product.imageUrl}}"
                             class="rounded"
                             style="width:80px; height:80px; object-fit:cover;">
                    </td>

                    <!-- Tên -->
                    <td class="text-start fw-semibold"
                        th:text="${item.product.name}">
                    </td>

                    <!-- Giá -->
                    <td class="text-danger fw-bold"
                        th:text="${#numbers.formatDecimal(item.product.price,0,'COMMA',0,'POINT')} + ' đ'">
                    </td>

                    <!-- Số lượng -->
                    <td>
                        <span class="badge bg-secondary"
                              th:text="${item.quantity}">
                        </span>
                    </td>

                    <!-- Tổng -->
                    <td class="fw-bold text-success"
                        th:text="${#numbers.formatDecimal(item.product.price * item.quantity,0,'COMMA',0,'POINT')} + ' đ'">
                    </td>

                    <!-- Xóa -->
                    <td>
                        <a th:href="@{/cart/remove/{id}(id=${item.product.id})}"
                           class="btn btn-sm btn-outline-danger">
                            ✖
                        </a>
                    </td>

                </tr>
                </tbody>
            </table>

        </div>
    </div>

    <!-- Tổng tiền -->
    <div class="card mt-4 shadow-sm text-end p-4"
         th:if="${not #lists.isEmpty(cartItems)}">

        <h4>
            Tổng tiền:
            <span class="text-danger fw-bold"
                  th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT')} + ' đ'">
            </span>
        </h4>

        <a th:href="@{/cart/checkout}" class="btn btn-success px-4">
            💳 Thanh toán
        </a>

    </div>

</div>

</body>
</html>
