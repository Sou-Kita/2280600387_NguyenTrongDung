<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Sách</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">📚 Quản Lý Sách</h4>
        </div>

        <div class="card-body">

            <a th:href="@{/books/create}" class="btn btn-success mb-3">
                ➕ Thêm Sách
            </a>

            <table class="table table-bordered table-hover text-center">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tiêu đề</th>
                    <th>Tác giả</th>
                    <th>Ngày xuất bản</th>
                    <th>Giá</th>
                    <th>Thể loại</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.id}"></td>
                    <td th:text="${book.title}"></td>
                    <td th:text="${book.author}"></td>
                    <td th:text="${book.publishedDate}"></td>
                    <td th:text="${book.price} + ' VND'"></td>
                    <td>
                        <span th:if="${book.category != null}"
                                th:text="${book.category.name}"></span>

                        <span th:if="${book.category == null}">
                                Chưa có
                        </span>
                    </td>
                    <td>
                        <a th:href="@{/books/edit/{id}(id=${book.id})}"
                           class="btn btn-warning btn-sm">✏ Sửa</a>

                        <a th:href="@{/books/delete/{id}(id=${book.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Bạn có chắc muốn xóa?')">
                            🗑 Xóa
                        </a>
                    </td>
                </tr>
                </tbody>

            </table>
        </div>
    </div>
</div>

</body>
</html>
