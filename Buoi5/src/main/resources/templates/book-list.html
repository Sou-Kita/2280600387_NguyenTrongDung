<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book List</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">📚 Book Management</h2>
        <div>
            <a href="/cart" class="btn btn-warning">🛒 Cart</a>
            <a href="/books/create" class="btn btn-success">➕ Add Book</a>
        </div>
    </div>

    <!-- SEARCH + FILTER + SORT -->
    <form method="get" action="/books" class="row g-2 mb-3">

        <!-- SEARCH -->
        <div class="col-md-4">
            <input type="text" name="keyword" class="form-control"
                   placeholder="🔍 Search..."
                   th:value="${keyword}">
        </div>

        <!-- CATEGORY -->
        <div class="col-md-3">
            <select name="categoryId" class="form-select">
                <option value="">All Categories</option>
                <option th:each="c : ${categories}"
                        th:value="${c.id}"
                        th:selected="${c.id == categoryId}"
                        th:text="${c.name}">
                </option>
            </select>
        </div>

        <!-- SORT -->
        <div class="col-md-3">
            <select name="sort" class="form-select">
                <option value="">Sort</option>
                <option value="asc" th:selected="${sort == 'asc'}">Price ↑</option>
                <option value="desc" th:selected="${sort == 'desc'}">Price ↓</option>
            </select>
        </div>

        <!-- BUTTON -->
        <div class="col-md-2">
            <button class="btn btn-primary w-100">Apply</button>
        </div>
    </form>

    <!-- TABLE -->
    <div class="card shadow">
        <div class="card-body">

            <table class="table table-hover align-middle">
                <thead class="table-dark text-center">
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Price</th>
                    <th>Date</th>
                    <th>Category</th>
                    <th width="220px">Action</th>
                </tr>
                </thead>

                <tbody>

                <!-- EMPTY -->
                <tr th:if="${#lists.isEmpty(books)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        No books found
                    </td>
                </tr>

                <!-- DATA -->
                <tr th:each="b : ${books}">
                    <td class="fw-semibold" th:text="${b.title}"></td>
                    <td th:text="${b.author}"></td>

                    <!-- format tiền -->
                    <td th:text="${#numbers.formatDecimal(b.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>

                    <td th:text="${b.publishedDate}"></td>

                    <td>
                        <span class="badge bg-info"
                              th:text="${b.category != null ? b.category.name : 'No Category'}">
                        </span>
                    </td>

                    <td class="text-center">
                        <a th:href="@{/books/edit/{id}(id=${b.id})}"
                           class="btn btn-primary btn-sm">Edit</a>

                        <a th:href="@{/books/delete/{id}(id=${b.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete this book?')">Delete</a>

                        <a th:href="@{/cart/add/{id}(id=${b.id})}"
                           class="btn btn-warning btn-sm">Cart</a>
                    </td>
                </tr>

                </tbody>
            </table>

        </div>
    </div>

    <!-- PAGINATION -->
    <div class="d-flex justify-content-between align-items-center mt-3">

        <a th:if="${currentPage > 0}"
           th:href="@{/books(page=${currentPage - 1}, keyword=${keyword}, categoryId=${categoryId}, sort=${sort})}"
           class="btn btn-secondary">
            ⬅ Prev
        </a>

        <span class="fw-bold">
            Page [[${currentPage + 1}]] / [[${totalPages}]]
        </span>

        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/books(page=${currentPage + 1}, keyword=${keyword}, categoryId=${categoryId}, sort=${sort})}"
           class="btn btn-secondary">
            Next ➡
        </a>

    </div>

</div>

</body>
</html>
