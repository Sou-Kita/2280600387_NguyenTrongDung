<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form Sách</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h4 th:text="${book.id == null} ? '➕ Thêm Sách' : '✏ Cập Nhật Sách'"></h4>
        </div>

        <div class="card-body">
            <form th:action="@{/books/save}" th:object="${book}" method="post">

                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">Tiêu đề</label>
                    <input type="text" th:field="*{title}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tác giả</label>
                    <input type="text" th:field="*{author}" class="form-control" required>
                </div>
                <select th:field="*{category.id}">
                    <option value="">-- Chọn thể loại --</option>
                    <option th:each="c : ${categories}"
                            th:value="${c.id}"
                            th:text="${c.name}">
                    </option>
                </select>
                <div class="mb-3">
                    <label class="form-label">Ngày xuất bản</label>
                    <input type="date" th:field="*{publishedDate}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Giá</label>
                    <input type="number" th:field="*{price}" class="form-control" required>
                </div>


                <button type="submit" class="btn btn-primary">💾 Lưu</button>
                <a th:href="@{/books}" class="btn btn-secondary">↩ Quay lại</a>

            </form>
        </div>
    </div>
</div>

</body>
</html>
