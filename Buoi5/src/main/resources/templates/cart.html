<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-4">
        <h2>🛒 Shopping Cart</h2>
        <a href="/books" class="btn btn-outline-primary">← Continue</a>
    </div>

    <div class="card shadow">
        <div class="card-body">

            <table class="table align-middle text-center">
                <thead class="table-dark">
                <tr>
                    <th>Book</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>

                <tr th:if="${cart == null or #maps.isEmpty(cart)}">
                    <td colspan="5">Cart is empty</td>
                </tr>

                <tr th:each="entry : ${cart}">
                    <td th:text="${entry.key.title}"></td>

                    <td th:text="${entry.key.price} + ' ₫'"></td>

                    <!-- QUANTITY -->
                    <td>
                        <a th:href="@{/cart/decrease/{id}(id=${entry.key.id})}"
                           class="btn btn-sm btn-secondary">-</a>

                        <span class="mx-2 fw-bold" th:text="${entry.value}"></span>

                        <a th:href="@{/cart/increase/{id}(id=${entry.key.id})}"
                           class="btn btn-sm btn-secondary">+</a>
                    </td>

                    <td th:text="${entry.key.price * entry.value} + ' ₫'"></td>

                    <!-- REMOVE -->
                    <td>
                        <a th:href="@{/cart/remove/{id}(id=${entry.key.id})}"
                           class="btn btn-danger btn-sm">❌</a>
                    </td>
                </tr>

                </tbody>
            </table>

        </div>
    </div>

    <!-- CHECKOUT -->
    <div class="card mt-4 shadow">
        <div class="card-body d-flex justify-content-between">

            <h4>
                Total:
                <span class="text-danger fw-bold" th:text="${total} + ' ₫'"></span>
            </h4>

            <form action="/checkout" method="get">
                <button class="btn btn-success btn-lg">💳 Checkout</button>
            </form>

        </div>
    </div>

</div>

</body>
</html>
