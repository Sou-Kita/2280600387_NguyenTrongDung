<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm sản phẩm</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h2 class="mb-4 text-primary">➕ Thêm sản phẩm</h2>

<form th:action="@{/products/add}"
      th:object="${product}"
      method="post"
      enctype="multipart/form-data"
      class="card p-4 shadow">

    <!-- Tên -->
    <div class="mb-3">
        <label class="form-label">Tên sản phẩm</label>
        <input type="text" th:field="*{name}" class="form-control">
        <div class="text-danger" th:errors="*{name}"></div>
    </div>

    <!-- Giá -->
    <div class="mb-3">
        <label class="form-label">Giá</label>
        <input type="number" th:field="*{price}" class="form-control">
        <div class="text-danger" th:errors="*{price}"></div>
    </div>

    <!-- Danh mục -->
    <div class="mb-3">
        <label class="form-label">Danh mục</label>
        <select th:field="*{category}" class="form-select">
            <option value="">-- Chọn danh mục --</option>
            <option value="Điện thoại">Điện thoại</option>
            <option value="Laptop">Laptop</option>
        </select>
        <div class="text-danger" th:errors="*{category}"></div>
    </div>

    <!-- Hình ảnh -->
    <div class="mb-3">
        <label class="form-label">Hình ảnh</label>
        <input type="file" name="file" class="form-control">
        <div class="text-danger" th:errors="*{image}"></div>
    </div>

    <!-- Nút -->
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">Lưu</button>
        <a th:href="@{/products}" class="btn btn-secondary">Quay lại</a>
    </div>

</form>

</body>
</html>
