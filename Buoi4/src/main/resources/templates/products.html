<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh sách sản phẩm</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2 class="mb-3">Quản lý sản phẩm</h2>

<a class="btn btn-primary mb-3" th:href="@{/products/add}">+ Thêm sản phẩm</a>

<table class="table table-bordered text-center">
    <tr>
        <th>ID</th>
        <th>Tên</th>
        <th>Giá</th>
        <th>Danh mục</th>
        <th>Hình</th>
        <th>Hành động</th>
    </tr>
    <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.price}"></td>
        <td th:text="${p.category}"></td>
        <td>
            <img th:src="@{'/uploads/' + ${p.image}}" width="80">
        </td>
        <td>
            <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn btn-warning btn-sm">Sửa</a>
            <a th:href="@{/products/delete/{id}(id=${p.id})}" class="btn btn-danger btn-sm">Xóa</a>
        </td>
    </tr>
</table>

</body>
</html>
