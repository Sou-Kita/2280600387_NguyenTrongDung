<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sửa sản phẩm</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h2 class="mb-4 text-warning">✏️ Sửa sản phẩm</h2>

<form th:action="@{/products/edit}"
      th:object="${product}"
      method="post"
      enctype="multipart/form-data"
      class="card p-4 shadow">

    <!-- ID (ẩn nhưng BẮT BUỘC) -->
    <input type="hidden" th:field="*{id}">

    <!-- Tên -->
    <div class="mb-3">
        <label class="form-label">Tên sản phẩm</label>
        <input type="text" th:field="*{name}" class="form-control">
        <div class="text-danger" th:errors="*{name}"></div>
    </div>

    <!-- Giá -->
    <div class="mb-3">
        <label class="form-label">Giá</label>
        <input type="number" th:field="*{price}" class="form-control">
        <div class="text-danger" th:errors="*{price}"></div>
    </div>

    <!-- Danh mục -->
    <div class="mb-3">
        <label class="form-label">Danh mục</label>
        <select th:field="*{category}" class="form-select">
            <option value="">-- Chọn danh mục --</option>
            <option value="Điện thoại">Điện thoại</option>
            <option value="Laptop">Laptop</option>
        </select>
        <div class="text-danger" th:errors="*{category}"></div>
    </div>

    <!-- Hình cũ -->
    <div class="mb-3" th:if="${product.image != null}">
        <label class="form-label">Hình hiện tại</label><br>
        <img th:src="@{'/uploads/' + ${product.image}}" width="120" class="border">
    </div>

    <!-- Upload hình mới -->
    <div class="mb-3">
        <label class="form-label">Đổi hình (nếu có)</label>
        <input type="file" name="file" class="form-control">
    </div>

    <!-- Nút -->
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-warning">Cập nhật</button>
        <a th:href="@{/products}" class="btn btn-secondary">Quay lại</a>
    </div>

</form>

</body>
</html>
